<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dead Man Standing - 3D Demo</title>
    <style>
      :root {
        --bg-1: #09111d;
        --bg-2: #111f2d;
        --panel: rgba(8, 15, 22, 0.68);
        --panel-border: rgba(255, 255, 255, 0.15);
        --text: #e7efff;
        --accent: #7dd3fc;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at top, var(--bg-2), var(--bg-1));
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
      }

      canvas {
        width: 100vw;
        height: 100vh;
        display: block;
        background: linear-gradient(#0d1728 0%, #0d1d2d 40%, #091319 100%);
        cursor: crosshair;
      }

      .hud {
        position: fixed;
        left: 18px;
        top: 18px;
        padding: 12px 16px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        backdrop-filter: blur(6px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        user-select: none;
      }

      .hud h1 {
        margin: 0 0 8px;
        font-size: 17px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .hud p {
        margin: 2px 0;
        font-size: 12px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div class="hud">
      <h1>Dead Man Standing</h1>
      <p>WASD: move</p>
      <p>Space: jump</p>
      <p>Mouse drag: look</p>
    </div>

    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      const keys = {};
      let pointerDown = false;
      let lastPointerX = 0;
      let lastPointerY = 0;

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
      const toRadians = (deg) => (deg * Math.PI) / 180;
      const normalize = (v) => {
        const length = Math.hypot(v.x, v.y, v.z) || 1;
        return { x: v.x / length, y: v.y / length, z: v.z / length };
      };

      function setCanvasSize() {
        const ratio = window.devicePixelRatio || 1;
        canvas.width = Math.floor(window.innerWidth * ratio);
        canvas.height = Math.floor(window.innerHeight * ratio);
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function getScreenSize() {
        return { width: canvas.width / (window.devicePixelRatio || 1), height: canvas.height / (window.devicePixelRatio || 1) };
      }

      const camera = {
        x: 0,
        y: 3.5,
        z: 9,
        yaw: 0,
        pitch: -0.4,
        lookAt: { x: 0, y: 1.5, z: 0 },
      };

      const platform = {
        x: 0,
        y: 0,
        z: 0,
        w: 18,
        h: 1.5,
        d: 18,
        topY: 1.5,
        color: '#4d7a5b',
      };

      const player = {
        x: 0,
        y: platform.topY + 0.9,
        z: 0,
        vx: 0,
        vy: 0,
        vz: 0,
        radius: 0.5,
        height: 1.8,
        grounded: true,
        jumpReady: true,
      };

      const boxes = [
        { center: { x: 0, y: platform.y + platform.h / 2, z: 0 }, size: { x: platform.w, y: platform.h, z: platform.d }, color: '#5d7f5e' },
        { center: { x: -4, y: 1.75, z: -4 }, size: { x: 2.2, y: 3.5, z: 2.2 }, color: '#7da1d6' },
        { center: { x: 4.5, y: 1.2, z: 3.4 }, size: { x: 1.8, y: 2.4, z: 1.8 }, color: '#d9a66a' },
      ];

      function moveCameraWithPlayer() {
        const distance = 5.6;
        const offset_x = -Math.sin(camera.yaw) * distance;
        const offset_z = -Math.cos(camera.yaw) * distance;

        camera.x = player.x + offset_x;
        camera.z = player.z + offset_z;
        camera.y = player.y + 2.6;
        camera.lookAt.x = player.x;
        camera.lookAt.y = player.y + 1.1;
        camera.lookAt.z = player.z;
      }

      function rotateCameraFromMouse(dx, dy) {
        camera.yaw -= dx * 0.004;
        camera.pitch = clamp(camera.pitch - dy * 0.003, -1.2, 1.2);
      }

      function updatePlayer(dt) {
        const moveInputX = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
        const moveInputZ = (keys.w ? 1 : 0) - (keys.s ? 1 : 0);

        const forward = {
          x: Math.sin(camera.yaw),
          z: Math.cos(camera.yaw),
        };

        const right = {
          x: Math.cos(camera.yaw),
          z: -Math.sin(camera.yaw),
        };

        const rawX = forward.x * moveInputZ + right.x * moveInputX;
        const rawZ = forward.z * moveInputZ + right.z * moveInputX;

        let magnitude = Math.hypot(rawX, rawZ) || 1;
        const moveX = (rawX / magnitude) * 5.4;
        const moveZ = (rawZ / magnitude) * 5.4;

        const groundY = platform.topY + player.height / 2;

        if (keys[' ']) {
          if (player.grounded && player.jumpReady) {
            player.vy = 7.4;
            player.grounded = false;
            player.jumpReady = false;
          }
        } else {
          player.jumpReady = true;
        }

        player.vx = moveX;
        player.vz = moveZ;
        player.x += player.vx * dt;
        player.z += player.vz * dt;

        player.vy -= 18 * dt;
        player.y += player.vy * dt;

        const horizontalEdgeLimit = platform.w / 2 - player.radius;
        const depthEdgeLimit = platform.d / 2 - player.radius;

        if (Math.abs(player.x) > horizontalEdgeLimit || Math.abs(player.z) > depthEdgeLimit) {
          player.grounded = false;
        }

        if (!player.grounded && player.y <= groundY && player.vy <= 0) {
          player.y = groundY;
          player.vy = 0;
          player.grounded = true;
        }

        if (player.y < -10) {
          player.x = 0;
          player.y = groundY;
          player.z = 0;
          player.vx = 0;
          player.vy = 0;
          player.vz = 0;
          player.grounded = true;
        }

        moveCameraWithPlayer();
      }

      function subtract(a, b) {
        return { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z };
      }

      function cross(a, b) {
        return {
          x: a.y * b.z - a.z * b.y,
          y: a.z * b.x - a.x * b.z,
          z: a.x * b.y - a.y * b.x,
        };
      }

      function dot(a, b) {
        return a.x * b.x + a.y * b.y + a.z * b.z;
      }

      function rotatePoint(point, origin, yaw, pitch) {
        const dx = point.x - origin.x;
        const dy = point.y - origin.y;
        const dz = point.z - origin.z;

        const cosY = Math.cos(-yaw);
        const sinY = Math.sin(-yaw);
        const x1 = dx * cosY - dz * sinY;
        const z1 = dx * sinY + dz * cosY;

        const cosP = Math.cos(-pitch);
        const sinP = Math.sin(-pitch);
        const y2 = dy * cosP - z1 * sinP;
        const z2 = dy * sinP + z1 * cosP;

        return { x: x1 + origin.x, y: y2 + origin.y, z: z2 + origin.z };
      }

      function projectToScreen(point) {
        const dx = point.x - camera.x;
        const dy = point.y - camera.y;
        const dz = point.z - camera.z;

        const cosY = Math.cos(-camera.yaw);
        const sinY = Math.sin(-camera.yaw);
        const x1 = dx * cosY - dz * sinY;
        const z1 = dx * sinY + dz * cosY;

        const cosP = Math.cos(-camera.pitch);
        const sinP = Math.sin(-camera.pitch);
        const y2 = dy * cosP - z1 * sinP;
        const z2 = dy * sinP + z1 * cosP;

        if (z2 <= 0.1) return null;

        const fov = 600;
        const scale = fov / z2;
        const screenX = getScreenSize().width / 2 + x1 * scale;
        const screenY = getScreenSize().height / 2 - y2 * scale;
        return { x: screenX, y: screenY, z: z2 };
      }

      function drawFace(face, faceColor) {
        const points = face.map((p) => projectToScreen(p));
        if (points.some((p) => !p)) return;

        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
        ctx.closePath();

        const avgZ = points.reduce((sum, p) => sum + p.z, 0) / points.length;
        const shade = clamp(0.45 + ((avgZ > 0 ? 1 / avgZ : 0) * 0.08), 0.25, 1);

        ctx.fillStyle = faceColor;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      function getBoxFaces(box) {
        const { x, y, z } = box.center;
        const { x: sx, y: sy, z: sz } = box.size;
        const hx = sx / 2;
        const hy = sy / 2;
        const hz = sz / 2;

        const verts = [
          { x: x - hx, y: y - hy, z: z - hz },
          { x: x + hx, y: y - hy, z: z - hz },
          { x: x + hx, y: y + hy, z: z - hz },
          { x: x - hx, y: y + hy, z: z - hz },
          { x: x - hx, y: y - hy, z: z + hz },
          { x: x + hx, y: y - hy, z: z + hz },
          { x: x + hx, y: y + hy, z: z + hz },
          { x: x - hx, y: y + hy, z: z + hz },
        ];

        const faces = [
          [0, 1, 2, 3],
          [4, 5, 6, 7],
          [0, 1, 5, 4],
          [1, 2, 6, 5],
          [2, 3, 7, 6],
          [3, 0, 4, 7],
        ];

        return faces.map((indices) => indices.map((i) => verts[i]));
      }

      function drawPlayerShadow() {
        const ground = projectToScreen({ x: player.x, y: platform.topY + 0.03, z: player.z });
        if (!ground) return;
        const size = 0.75 * (600 / ground.z);
        ctx.beginPath();
        ctx.ellipse(ground.x, ground.y + 18, size, size * 0.35, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fill();
      }

      function renderScene() {
        ctx.clearRect(0, 0, getScreenSize().width, getScreenSize().height);

        const sky = ctx.createLinearGradient(0, 0, 0, getScreenSize().height);
        sky.addColorStop(0, '#0d192a');
        sky.addColorStop(0.4, '#10263b');
        sky.addColorStop(1, '#0b1016');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, getScreenSize().width, getScreenSize().height);

        const light = normalize({ x: -0.4, y: 1.0, z: 0.7 });
        const faces = [];

        for (const box of boxes) {
          const boxFaces = getBoxFaces(box);
          for (const face of boxFaces) {
            const a = face[0];
            const b = face[1];
            const c = face[2];
            const normal = normalize(cross(subtract(b, a), subtract(c, a)));
            const faceCenter = {
              x: (face[0].x + face[1].x + face[2].x + face[3].x) / 4,
              y: (face[0].y + face[1].y + face[2].y + face[3].y) / 4,
              z: (face[0].z + face[1].z + face[2].z + face[3].z) / 4,
            };

            const cameraVec = subtract(camera, faceCenter);
            const cameraDot = dot(normalize(cameraVec), normal);
            if (cameraDot < 0) continue;

            const shade = clamp(0.35 + dot(normal, light) * 0.7, 0.15, 1);
            const rgba = `rgba(${Math.round(255 * shade)}, ${Math.round(255 * shade)}, ${Math.round(255 * shade)}, 1)`;
            const proj = face.map((p) => projectToScreen(p)).filter(Boolean);
            if (proj.length < 3) continue;

            const averageZ = proj.reduce((sum, p) => sum + p.z, 0) / proj.length;
            faces.push({ projected: proj, color: rgba, z: averageZ });
          }
        }

        faces.sort((a, b) => b.z - a.z);
        for (const face of faces) {
          ctx.beginPath();
          ctx.moveTo(face.projected[0].x, face.projected[0].y);
          for (let i = 1; i < face.projected.length; i++) ctx.lineTo(face.projected[i].x, face.projected[i].y);
          ctx.closePath();
          ctx.fillStyle = face.color;
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.14)';
          ctx.stroke();
        }

        drawPlayerShadow();

        const playerBox = getBoxFaces({
          center: { x: player.x, y: player.y, z: player.z },
          size: { x: player.radius * 2, y: player.height, z: player.radius * 2 },
        });

        for (const face of playerBox) {
          const verts = face.map((p) => projectToScreen(p));
          if (verts.some((p) => !p)) continue;
          ctx.beginPath();
          ctx.moveTo(verts[0].x, verts[0].y);
          for (let i = 1; i < verts.length; i++) ctx.lineTo(verts[i].x, verts[i].y);
          ctx.closePath();
          ctx.fillStyle = '#edc27d';
          ctx.fill();
          ctx.strokeStyle = '#f8e5bc';
          ctx.stroke();
        }

        const groundTarget = projectToScreen({ x: player.x, y: player.y - player.height / 2 + 0.08, z: player.z });
        if (groundTarget) {
          ctx.beginPath();
          ctx.arc(groundTarget.x, groundTarget.y, 12, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.12)';
          ctx.fill();
        }
      }

      let lastFrame = performance.now();
      function gameLoop(now) {
        const dt = Math.min((now - lastFrame) / 1000, 0.033);
        lastFrame = now;

        updatePlayer(dt);
        renderScene();

        requestAnimationFrame(gameLoop);
      }

      document.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        keys[key] = true;
        if (key === ' ') keys[' '] = true;
      });

      document.addEventListener('keyup', (event) => {
        const key = event.key.toLowerCase();
        keys[key] = false;
        if (key === ' ') keys[' '] = false;
      });

      canvas.addEventListener('pointerdown', (event) => {
        pointerDown = true;
        lastPointerX = event.clientX;
        lastPointerY = event.clientY;
      });

      canvas.addEventListener('pointerup', () => {
        pointerDown = false;
      });

      canvas.addEventListener('pointerleave', () => {
        pointerDown = false;
      });

      canvas.addEventListener('pointermove', (event) => {
        if (!pointerDown) return;
        const dx = event.clientX - lastPointerX;
        const dy = event.clientY - lastPointerY;
        rotateCameraFromMouse(dx, dy);
        lastPointerX = event.clientX;
        lastPointerY = event.clientY;
      });

      window.addEventListener('resize', setCanvasSize);
      setCanvasSize();
      requestAnimationFrame(gameLoop);
    </script>
  </body>
</html>
